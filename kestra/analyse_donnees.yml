id: pipeline_avantages_sportifs
namespace: projet_12

description: >
  Pipeline POC pour nettoyer les données RH et sportives, fusionner les sources,
  simuler des activités Strava, calculer les distances domicile-entreprise,
  contrôler la qualité avec Great Expectations, préparer les sorties Power BI
  et envoyer une notification Slack.

labels:
  projet: projet_12
  domaine: rh_sport
  niveau: poc

inputs:
  - id: prime_percentage
    type: FLOAT
    defaults: 0.05
    description: "Pourcentage de la prime sportive (ex. 0.05 pour 5%)"

tasks:
  - id: demarrage
    type: io.kestra.plugin.core.log.Log
    message: "Démarrage du pipeline Projet 12 - avantages sportifs."

  - id: preparer_repertoires
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - mkdir -p /workspace/outputs

  - id: initialiser_base_donnees
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/init_db.py
  
  - id: generer_activites_postgres
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/simulate_strava.py

  - id: notifier_activites_slack
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/notify_slack.py

  - id: calculer_distances
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/calculate_distances.py

  - id: controler_qualite_donnees
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/validate_data_gx.py

  - id: calculer_impact_financier
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        # Charger et nettoyer les variables du fichier .env
        if [ -f .env ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              \#*|""|*$'\\r') continue ;;
            esac
            line=$(echo "$line" | tr -d '\r')
            export "$line"
          done < .env
        fi
        # Adapter l'hôte Postgres pour Docker
        if [ "$POSTGRES_HOST" = "localhost" ] || [ "$POSTGRES_HOST" = "127.0.0.1" ]; then
          export POSTGRES_HOST="host.docker.internal"
        fi
        cd dbt_avantages_sportifs
        dbt run --profiles-dir . --vars '{"prime_percentage": {{ inputs.prime_percentage }} }'
        cd /workspace
        python scripts/export_dbt_outputs.py

  - id: synchroniser_streaming_prime
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
        - "/var/run/docker.sock:/var/run/docker.sock"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/sync_streaming.py --pct {{ inputs.prime_percentage }}

  - id: preparer_power_bi
    type: io.kestra.plugin.core.log.Log
    message: >
      Sorties Power BI disponibles dans outputs/: donnees_fusionnees.csv,
      donnees_financieres.csv, impact_financier.json, activites_strava_simulees.csv, 
      resume_analyse.json, validation_distances.json et rapport_qualite_great_expectations.json. 
      En production, ces fichiers peuvent être charges dans une base SQL ou un data 
      warehouse puis consommes par Power BI.

  - id: notifier_slack
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      volumes:
        - "/run/desktop/mnt/host/c/Users/Pascal/Desktop/Projet_12:/workspace"
    containerImage: projet12-kestra-runner
    commands:
      - |
        cd /workspace
        python scripts/notify_pipeline.py

  - id: monitoring
    type: io.kestra.plugin.core.log.Log
    message: >
      Monitoring POC: consulter les exécutions, logs et durées dans Kestra.
      Évolution production: exposer les métriques Kestra vers Prometheus,
      construire des dashboards Grafana et ajouter des alertes sur échec,
      durée anormale ou volume de données incohérent.

  - id: evolutions_prod_cdc_debezium
    type: io.kestra.plugin.core.log.Log
    message: >
      Évolution production facultative: ajouter Debezium pour le CDC afin de
      capturer en temps réel les changements des sources RH, sportives ou
      Strava-like. Le CDC alimenterait une base ou un topic, puis Kestra
      orchestrerait les contrôles, la consolidation et les exports Power BI.

  - id: fin
    type: io.kestra.plugin.core.log.Log
    message: "Pipeline Projet 12 termine."
